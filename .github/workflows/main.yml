name: Build SysLoader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup MinGW
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x64
    
    - name: Build
      run: |
        cd src
        g++ -O2 -mwindows -std=c++17 -o ../SysLoader.exe main.cpp -lcomctl32 -ladvapi32 -lshlwapi -luser32 -lgdi32 -lws2_32 -static
        g++ -O2 -shared -std=c++17 -o ../SysLoader.dll main.cpp -D_DLL -lcomctl32 -ladvapi32 -lshlwapi -luser32 -lgdi32 -lws2_32 -static
        cd ..
        echo [Settings] > sys.ini
        echo Driver=MyDriver.sys >> sys.ini
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SysLoader
        path: |
          SysLoader.exe
          SysLoader.dll
          sys.ini
          resources/Loader.sys
